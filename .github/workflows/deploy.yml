name: Deploy admin

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Typecheck and build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # Dedicated host admin.goelprep.com — must be root, not /admin/
          BASE_PATH: /
          PORT: "3001"
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm run build

      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          [ -n "$HOST" ] || { echo "Missing secret EC2_HOST"; missing=1; }
          [ -n "$SSH_USER" ] || { echo "Missing secret EC2_SSH_USER"; missing=1; }
          [ -n "$KEY" ] || { echo "Missing secret EC2_SSH_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add them on the production environment: Settings → Secrets → Actions"
            echo "This repo must use the goelprep.admin instance, not goelprep.app."
            exit 1
          fi

      - name: Prepare SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_USER: ${{ secrets.EC2_SSH_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          HOST=$(printf '%s' "$EC2_HOST" | tr -d '\r\n ')
          USER=$(printf '%s' "$EC2_SSH_USER" | tr -d '\r\n ')
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Connecting to ${HOST} as ${USER}"
          if ! ssh-keyscan -T 20 "$HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "ssh-keyscan could not reach ${HOST}:22"
            cat /tmp/keyscan.err || true
            exit 1
          fi
          if ! grep -qE ' (ssh-|ecdsa-)' ~/.ssh/known_hosts; then
            echo "ssh-keyscan wrote no host keys for ${HOST}:22"
            cat /tmp/keyscan.err || true
            exit 1
          fi
          {
            echo "Host deploy-target"
            echo "  HostName ${HOST}"
            echo "  User ${USER}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Sync and restart
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .env --exclude .env.local \
            --exclude logs --exclude .git \
            ./ deploy-target:/opt/admin/
          scp deploy/remote-deploy.sh deploy/admin.service deploy-target:/tmp/
          ssh deploy-target "sudo cp /tmp/admin.service /etc/systemd/system/admin.service && bash /tmp/remote-deploy.sh /opt/admin admin"
